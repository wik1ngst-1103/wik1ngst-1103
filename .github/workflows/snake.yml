name: Build live profile cards

on:
  schedule:
    - cron: "0 0 * * *"   # mỗi ngày lúc 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Runs before snk: the snk container writes dist/ as root, so Python goes first.
      - name: Build stats and quest cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet fonttools
          python scripts/build_live.py --user "${{ github.repository_owner }}" --out dist

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1F2328&color_dots=#EBEEF1,#F2E3B8,#E3C26B,#BF8700,#9A6700
            dist/github-snake-dark.svg?color_snake=#E6EDF3&color_dots=#161B22,#3A3220,#6B5A2A,#B08A2E,#E3B341

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
