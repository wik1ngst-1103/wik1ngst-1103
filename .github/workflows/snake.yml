name: Build live cabinet assets

on:
  schedule:
    - cron: "0 0 * * *"   # mỗi ngày lúc 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0E0F1A&color_dots=#E4E8F5,#9DB0EE,#2A52CC,#FFC93C,#E8452C
            dist/github-snake-dark.svg?color_snake=#F6F1E6&color_dots=#161A33,#1C3FAA,#4C6FE0,#FFC93C,#E8452C

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate live stats screen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet fonttools
          python scripts/build_stats.py --user "${{ github.repository_owner }}" --out dist/stats.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
